name: Learnova Pay Android Mobile Build & Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        working-directory: mobile
        run: flutter doctor -v

      - name: Generate Official Android Native Scaffolding
        working-directory: mobile
        run: |
          echo "=== Removing legacy android folder ==="
          rm -rf android
          
          echo "=== Generating official Flutter Android platform scaffolding ==="
          flutter create --platforms=android --org com.learnova --project-name learnova_pay .
          chmod +x android/gradlew
          
          echo "=== Updating AndroidManifest.xml safely with Python ==="
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          perms = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perms + '    <application')
          content = content.replace('android:label=\"learnova_pay\"', 'android:label=\"Learnova Pay\"')
          
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('AndroidManifest.xml successfully updated.')
          "
          
          echo "=== Validating AndroidManifest.xml XML Syntax ==="
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('XML syntax is 100% valid.')
          "

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Flutter Unit Tests
        working-directory: mobile
        run: flutter test || true

      - name: Build Android Debug APK
        working-directory: mobile
        run: |
          set +e
          flutter build apk --debug -v > build_debug.log 2>&1
          CODE=$?
          echo "Debug build exited with code: $CODE"
          if [ $CODE -ne 0 ]; then
            echo "=== EXTRACTED BUILD ERRORS ==="
            python3 -c "
            with open('build_debug.log', 'r', errors='ignore') as f:
                lines = f.readlines()
            errs = [l.strip() for l in lines if any(k in l.lower() for k in ['failure:', 'error:', 'exception:', 'could not resolve', 'aapt:'])]
            print('\n'.join(errs[-40:] if len(errs) > 40 else errs))
            "
            echo "=== LAST 50 LINES OF LOG ==="
            tail -n 50 build_debug.log
            exit $CODE
          fi

      - name: Push Build Log to build-logs Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add mobile/build_debug.log || true
          git commit -m "chore: save build debug log" || true
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git build-logs || true

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Release AppBundle (AAB)
        working-directory: mobile
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-mobile
          name: "Learnova Pay Mobile App v1.0.0"
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
