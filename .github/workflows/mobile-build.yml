name: Learnova Pay Android Mobile Build & Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        working-directory: mobile
        run: flutter doctor -v

      - name: Generate Official Android Native Scaffolding
        working-directory: mobile
        run: |
          echo "=== Generating official Flutter Android platform files ==="
          rm -rf android
          flutter create --platforms=android --org com.learnova --project-name learnova_pay .
          chmod +x android/gradlew
          
          echo "=== Configuring AndroidManifest.xml permissions ==="
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="learnova_pay"/android:label="Learnova Pay"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name="${applicationName}"/android:name="${applicationName}"\n        android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          echo "=== Writing Razorpay Proguard Rules ==="
          cat << 'EOF' > android/app/proguard-rules.pro
          -keepattributes *Annotation*
          -dontwarn com.razorpay.**
          -keep class com.razorpay.** { *; }
          -optimizations !method/inlining/
          -keepclasseswithmembers class * {
              public void onPayment*(...);
          }
          -keep class proguard.annotation.** { *; }
          EOF

          echo "=== Applying AGP 8 Plugin Namespace Fallback to android/build.gradle ==="
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      if (project.android.namespace == null) {
                          project.android.namespace = project.group ?: "com.learnova.${project.name.replace('-', '_')}"
                      }
                  }
              }
          }
          EOF

          echo "=== Configuring Release Signing with Debug Keystore in app/build.gradle ==="
          python3 -c "
          p = 'android/app/build.gradle'
          with open(p, 'r') as f:
              c = f.read()
          # Ensure release signing uses debug keystore so release apk is installable
          if 'signingConfig = signingConfigs.debug' not in c:
              c = c.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.debug\n        }')
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Flutter Unit Tests
        working-directory: mobile
        run: flutter test || true

      - name: Build Android Debug APK
        working-directory: mobile
        run: |
          set +e
          flutter build apk --debug -v > build_debug.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "## ❌ Android Debug APK Build Failed (Exit Code $CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_debug.log
            exit $CODE
          else
            echo "## ✅ Android Debug APK Build Succeeded" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons -v > build_release.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "## ❌ Android Release APK Build Failed (Exit Code $CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_release.log
            exit $CODE
          else
            echo "## ✅ Android Release APK Build Succeeded" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Android Release AppBundle (AAB)
        working-directory: mobile
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-mobile
          name: "Learnova Pay Mobile App v1.0.0"
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
