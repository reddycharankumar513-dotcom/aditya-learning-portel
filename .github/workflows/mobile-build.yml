name: Learnova Pay Android Mobile Build & Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        working-directory: mobile
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter Unit Tests
        working-directory: mobile
        run: flutter test

      - name: Build Android Debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
