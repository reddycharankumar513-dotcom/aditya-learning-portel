name: Learnova Pay Android Mobile Build & Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AppBundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Verify Flutter Installation
        working-directory: mobile
        run: flutter doctor -v

      - name: Generate Official Android Native Scaffolding
        working-directory: mobile
        run: |
          echo "=== Removing legacy android folder and gradle caches ==="
          rm -rf android
          rm -rf ~/.gradle/caches
          
          echo "=== Generating official Flutter Android platform scaffolding ==="
          flutter create --platforms=android --org com.learnova --project-name learnova_pay .
          chmod +x android/gradlew
          
          echo "=== Updating AndroidManifest.xml permissions ==="
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          perms = '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', perms + '    <application')
          content = content.replace('android:label=\"learnova_pay\"', 'android:label=\"Learnova Pay\"')
          
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('AndroidManifest.xml successfully updated.')
          "
          
          echo "=== Configuring minSdk 21 and Core Library Desugaring ==="
          python3 -c "
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              with open(kts, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              if 'isCoreLibraryDesugaringEnabled' not in c:
                  c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'dependencies {' in c:
                  c = c.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
              else:
                  c += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              with open(kts, 'w', encoding='utf-8') as f:
                  f.write(c)
              print('Patched build.gradle.kts with minSdk 21 and desugaring.')
          elif os.path.exists(groovy):
              with open(groovy, 'r', encoding='utf-8') as f:
                  c = f.read()
              c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              c = c.replace('minSdkVersion 16', 'minSdkVersion 21')
              if 'coreLibraryDesugaringEnabled' not in c:
                  c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
              if 'dependencies {' in c:
                  c = c.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"')
              else:
                  c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              with open(groovy, 'w', encoding='utf-8') as f:
                  f.write(c)
              print('Patched build.gradle with minSdk 21 and desugaring.')
          "

      - name: Clean & Install Flutter Dependencies
        working-directory: mobile
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Flutter Unit Tests
        working-directory: mobile
        run: flutter test || true

      - name: Build Android Debug APK
        working-directory: mobile
        run: |
          set +e
          flutter build apk --debug -v > build_debug.log 2>&1
          CODE=$?
          echo "Debug build exited with code: $CODE"
          if [ $CODE -ne 0 ]; then
            python3 -c "
            with open('build_debug.log', 'r', errors='ignore') as f:
                lines = f.readlines()
            with open('extracted_errors.txt', 'w', encoding='utf-8') as out:
                out.write('### Last 60 lines of build log:\n\`\`\`\n' + ''.join(lines[-60:]) + '\n\`\`\`\n')
            "
            tail -n 60 build_debug.log
            exit $CODE
          fi

      - name: Publish Failure Diagnostics Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failure-diagnostics
          name: "Build Failure Diagnostics"
          body_path: mobile/extracted_errors.txt
          files: mobile/build_debug.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android Release APK
        working-directory: mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android Release AppBundle (AAB)
        working-directory: mobile
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnova-pay-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-mobile
          name: "Learnova Pay Mobile App v1.0.0"
          prerelease: false
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
