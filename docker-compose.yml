services:
  # =================================================================
  # LEARNOVA Database (Local MongoDB Community Edition)
  # =================================================================
  mongodb:
    image: mongo:7-jammy
    container_name: learnova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: learnova_platform
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnova-net

  # =================================================================
  # LEARNOVA Backend API (Node.js + Express + TypeScript)
  # =================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learnova-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/learnova_platform
      JWT_SECRET: learnova_local_dev_jwt_secret_token_123456
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: learnova-storage-local
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - learnova-net

  # =================================================================
  # LEARNOVA Frontend (React 19 + TypeScript + Vite)
  # =================================================================
  frontend:
    image: node:22-alpine
    container_name: learnova-frontend
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - learnova-net

volumes:
  mongo_data:
    driver: local

networks:
  learnova-net:
    driver: bridge
